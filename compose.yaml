services:
  brigid:
    image: ghcr.io/chilldryad/brigid:latest
    container_name: brigid
    restart: unless-stopped
    env_file:
      - ./brigid.env
    volumes:
      - ./data:/data
      - ./default-layout.json:/config/default-layout.json:ro
    expose:
      - "8000"
    networks:
      - caddy-homelab

networks:
  caddy-homelab:
    external: true
    name: caddy-homelab
